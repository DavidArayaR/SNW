<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW · Iniciar sesi&oacute;n</title>
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/auth.css?v=auth2">
  <script src="js/tema.js"></script>
  <script src="js/pass-toggle.js"></script>
</head>
<body class="pagina-auth pagina-login">

  <div id="toast" class="toast"></div>

  <div class="card">
    <div class="logo">💬</div>
    <h1>Notificaciones WhatsApp</h1>
    <p class="sub">Sistema de Notificaciones SNW</p>

    <form id="formLogin" novalidate>
      <label for="inpUsuario">Usuario</label>
      <input type="text" id="inpUsuario" autocomplete="username" required>
      <label for="inpClave">Contrase&ntilde;a</label>
      <input type="password" id="inpClave" autocomplete="current-password" required>
      <a href="#" class="link-olvide" id="lnkOlvide">¿Olvidaste tu contrase&ntilde;a?</a>
      <p class="error" id="msgError"></p>
      <button type="submit" id="btnEntrar">Iniciar sesi&oacute;n</button>
    </form>

    <form id="formOlvide" novalidate hidden>
      <p class="sub sub--olvido">Escribe tu correo y te enviaremos un enlace para crear una contrase&ntilde;a nueva. Dura 2 horas.</p>
      <label for="inpOlvideCorreo">Correo electr&oacute;nico</label>
      <input type="email" id="inpOlvideCorreo" autocomplete="email" placeholder="nombre@empresa.cl" required>
      <p class="error" id="msgOlvideError"></p>
      <p class="info" id="msgOlvideOk"></p>
      <button type="submit" id="btnOlvide">Enviar enlace</button>
      <a href="#" class="link-olvide link-olvide--volver" id="lnkVolverLogin">Volver a iniciar sesi&oacute;n</a>
    </form>

    <p class="nota">
      ¿No tienes cuenta? Pide que un administrador te invite.<br>
      <a href="index.html">Volver a la p&aacute;gina principal</a>
    </p>
  </div>

  <script>
    if (window.snwMontarFabTema) window.snwMontarFabTema();

    if (new URLSearchParams(location.search).get("salida") === "ok") {
      const toast = document.getElementById("toast");
      toast.textContent = "Sesión cerrada exitosamente";
      toast.className = "toast visible toast--ok";
      setTimeout(() => toast.classList.remove("visible"), 3200);
      history.replaceState(null, "", location.pathname);
    }

    (async function () {
      const t = localStorage.getItem("snw_token");
      if (!t) return;
      try {
        const r = await fetch("api/configuracion", { headers: { Authorization: "Bearer " + t } });
        if (!r.ok) throw new Error();
        const rol = localStorage.getItem("snw_rol");
        location.replace(rol === "administrador" || rol === "desarrollador" ? "usuarios.html" : "mensajeria.html");
      } catch {
        ["snw_token", "snw_rol", "snw_nombre", "snw_permisos"].forEach(k => localStorage.removeItem(k));
      }
    })();

    const form = document.getElementById("formLogin");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnEntrar");
      const err = document.getElementById("msgError");
      err.classList.remove("visible");
      btn.disabled = true;
      btn.classList.remove("exito");
      btn.innerHTML = '<span class="spinner"></span>Verificando...';

      try {
        const res = await fetch("api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usuario: document.getElementById("inpUsuario").value,
            clave: document.getElementById("inpClave").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail ?? "No se pudo iniciar sesión");

        localStorage.setItem("snw_token", data.token);
        localStorage.setItem("snw_rol", data.rol);
        localStorage.setItem("snw_nombre", data.nombre);
        localStorage.setItem("snw_permisos", JSON.stringify(data.permisos || []));

        btn.innerHTML = '<span class="btn-check">✓</span>¡Listo! Entrando...';
        btn.classList.add("exito");
        const destino = (data.rol === "administrador" || data.rol === "desarrollador"
          ? "usuarios.html" : "mensajeria.html") + "?entrada=ok";
        setTimeout(() => { location.href = destino; }, 2000);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Iniciar sesión";
      }
    });

    // ---- "¿Olvidaste tu contraseña?" ----
    const formLogin = document.getElementById("formLogin");
    const formOlvide = document.getElementById("formOlvide");
    const $ = (id) => document.getElementById(id);

    $("lnkOlvide").addEventListener("click", (e) => {
      e.preventDefault();
      formLogin.hidden = true;
      formOlvide.hidden = false;
      $("msgOlvideError").classList.remove("visible");
      $("msgOlvideOk").classList.remove("visible");
      $("inpOlvideCorreo").focus();
    });
    $("lnkVolverLogin").addEventListener("click", (e) => {
      e.preventDefault();
      formOlvide.hidden = true;
      formLogin.hidden = false;
    });

    formOlvide.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errO = $("msgOlvideError");
      const okO = $("msgOlvideOk");
      const b = $("btnOlvide");
      errO.classList.remove("visible");
      okO.classList.remove("visible");
      const correo = $("inpOlvideCorreo").value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(correo)) {
        errO.textContent = "Escribe un correo electrónico válido.";
        errO.classList.add("visible");
        return;
      }
      b.disabled = true;
      b.textContent = "Enviando...";
      try {
        await fetch("api/auth/olvide", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ correo }),
        });
      } catch { /* respuesta genérica igual */ }
      okO.textContent = "Si hay una cuenta con ese correo, te enviamos un enlace para restablecer la contraseña. Revisa tu bandeja (y el spam).";
      okO.classList.add("visible");
      b.disabled = false;
      b.textContent = "Enviar enlace";
    });
  </script>
</body>
</html>
