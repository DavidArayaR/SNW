<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW · Pacientes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pacientes.css">
  <link rel="stylesheet" href="css/layout.css">
  <script src="js/tema.js"></script>
</head>
<body data-pagina="pacientes">

  <div class="app-shell">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="app-topbar">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="app-topbar__titulo">Base de datos</span>
        <span class="app-topbar__sep"></span>
        <span class="badge badge--bd" id="nombreBd"></span>
        <select id="selAmbiente" class="badge badge--select" aria-label="Base de datos">
          <option value="desarrollo">Base de datos desarrollo</option>
          <option value="produccion">Base de datos producci&oacute;n</option>
        </select>
      </header>

  <main class="layout layout--ancho">

    <section class="panel">
      <div class="panel__head">
        <h2 id="tituloPacientes">Pacientes</h2>
        <div class="panel__actions">
          <button id="btnActualizar" class="btn btn--ghost" type="button">Actualizar</button>
        </div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar-pacientes">
        <input type="search" id="buscador" placeholder="Buscar por nombre, tel&eacute;fono o info..." autocomplete="off">
        <span id="contadorSel" class="contador-sel"></span>
      </div>

      <div class="toolbar-masivo" id="toolbarMasivo" hidden>
        <span class="toolbar-masivo__label">Con los seleccionados:</span>
        <label class="toolbar-masivo__campo">
          Estado
          <select id="selEstadoMasivo">
            <option value="" selected>— cambiar a —</option>
            <option value="pendiente">Pendiente</option>
            <option value="enviado">Enviado</option>
            <option value="error">Error</option>
          </select>
        </label>
        <label class="toolbar-masivo__campo">
          Respuesta
          <select id="selRespuestaMasivo">
            <option value="" selected>— cambiar a —</option>
            <option value="pendiente">Sin respuesta</option>
            <option value="respondio">Respondió</option>
            <option value="baja">Se dio de baja</option>
          </select>
        </label>
      </div>

      <div class="tabla-wrap">
        <table id="tablaPacientes">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="chkTodos" title="Seleccionar todos los visibles"></th>
              <th>ID</th>
              <th>Nombre</th>
              <th>Tel&eacute;fono</th>
              <th>Estado</th>
              <th>Error</th>
              <th>Respuesta</th>
              <th>Actualizado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="tablaVacia" class="tabla-vacia" hidden>Sin resultados.</p>
      </div>
    </section>

      </main>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/layout.js"></script>
  <script src="js/pass-toggle.js"></script>
  <script src="js/pacientes.js"></script>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
