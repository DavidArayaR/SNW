<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW · Pacientes</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pacientes.css">
</head>
<body>

  <header class="topbar">
    <a class="topbar__brand" href="index.html" title="Volver al inicio">
      <div>
        <h1>Notificaciones WhatsApp</h1>
        <p>Sistema de Notificaciones SNW</p>
      </div>
    </a>
    <div class="topbar__right">
      <span class="badge badge--bd" id="nombreBd"></span>
      <select id="selAmbiente" class="badge badge--select" aria-label="Base de datos">
        <option value="desarrollo">Base de datos desarrollo</option>
        <option value="produccion">Base de datos producción</option>
      </select>
      <button class="hamburger" id="btnMenu" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="menuNav">
        <a href="index.html">Inicio</a>
        <a href="pacientes.html" class="activo" data-solo-admin>Pacientes</a>
        <a href="mensajeria.html">Mensajería</a>
        <a href="historial.html">Historial</a>
      </nav>
    </div>
  </header>

  <main class="layout layout--ancho">

    <section class="panel">
      <div class="panel__head">
        <h2>Pacientes</h2>
        <div class="panel__actions">
          <button id="btnActualizar" class="btn btn--ghost" type="button">Actualizar</button>
          <button id="btnIniciar" class="btn btn--primary" type="button" disabled>Iniciar envío</button>
        </div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar-pacientes">
        <input type="search" id="buscador" placeholder="Buscar por nombre, teléfono o info..." autocomplete="off">
        <span id="contadorSel" class="contador-sel"></span>
      </div>

      <div class="tabla-wrap">
        <table id="tablaPacientes">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="chkTodos" title="Seleccionar todos los visibles"></th>
              <th>ID</th>
              <th>Nombre</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Info extra</th>
              <th>Actualizado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="tablaVacia" class="tabla-vacia" hidden>Sin resultados.</p>
      </div>
    </section>

  </main>

  <div id="modalEnvio" class="modal" hidden>
    <div class="modal__card modal__card--envio" role="dialog" aria-modal="true">
      <h3>Enviar mensaje</h3>

      <div id="faseConfig">
        <div id="listaPlantillasModal" class="tpl-radio"></div>
        <p class="resumen-linea" id="resumenLinea"></p>
        <div class="aviso-dev" id="avisoDev" hidden></div>
      </div>

      <div id="faseProgreso" hidden>
        <div class="progreso-info">
          <span id="progresoTexto">Preparando envío...</span>
          <span id="progresoNumeros" class="progreso-numeros"></span>
        </div>
        <div class="barra"><div class="barra__fill" id="barraFill"></div></div>
      </div>

      <ul id="listaRechazados" class="rechazados" hidden></ul>

      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="btnCancelarEnvio">Cancelar</button>
        <div class="acciones-derecha">
          <button type="button" class="btn btn--primary" id="btnCerrarModal" hidden>Cerrar</button>
          <button type="button" class="btn btn--primary" id="btnLanzarEnvio" hidden>Iniciar Envío</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    (function () {
      const token = localStorage.getItem("snw_token"), rol = localStorage.getItem("snw_rol");
      if (!token) { location.replace("login.html"); return; }
      window.snwSalir = function () {
        ["snw_token", "snw_rol", "snw_nombre"].forEach(k => localStorage.removeItem(k));
        location.replace("login.html");
      };
      if (rol !== "administrador") { location.replace("mensajeria.html"); return; }
      document.querySelectorAll("[data-solo-admin]").forEach(a => a.remove());
      const n = document.getElementById("menuNav");
      const salir = document.createElement("a");
      salir.href = "#";
      salir.textContent = "Cerrar sesión · " + (localStorage.getItem("snw_nombre") || "");
      salir.addEventListener("click", async (e) => {
        e.preventDefault();
        try { await fetch("api/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + token } }); } catch {}
        localStorage.clear();
        location.href = "login.html";
      });
      n.appendChild(salir);
    })();
  </script>
  <script src="js/pacientes.js"></script>
  <script>
    (function () {
      const b = document.getElementById("btnMenu"), n = document.getElementById("menuNav");
      if (!b || !n) return;
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        const o = n.classList.toggle("abierto");
        b.classList.toggle("abierto", o);
        b.setAttribute("aria-expanded", o);
      });
      document.addEventListener("click", (e) => {
        if (!b.contains(e.target) && !n.contains(e.target)) {
          n.classList.remove("abierto");
          b.classList.remove("abierto");
          b.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>
</html>
