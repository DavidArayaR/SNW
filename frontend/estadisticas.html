<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW &middot; Estad&iacute;sticas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pacientes.css">
  <link rel="stylesheet" href="css/estadisticas.css">
</head>
<body>

  <header class="topbar">
    <a class="topbar__brand" href="index.html" title="Volver al inicio">
      <i class="fa-brands fa-whatsapp"></i>
      <div>
        <h1>Notificaciones WhatsApp</h1>
        <p>Sistema de Notificaciones SNW</p>
      </div>
    </a>
    <div class="topbar__right">
      <button class="hamburger" id="btnMenu" aria-label="Abrir men&uacute;" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="menuNav">
        <a href="index.html"><i class="fa-solid fa-house"></i>Inicio</a>
        <a href="pacientes.html" data-solo-admin><i class="fa-solid fa-database"></i> Base de datos</a>
        <a href="mensajeria.html"><i class="fa-solid fa-envelope"></i> Mensajer&iacute;a</a>
        <a href="historial.html"><i class="fa-solid fa-clock-rotate-left"></i> Historial</a>
        <a href="estadisticas.html" class="activo"><i class="fa-solid fa-chart-column"></i> Estad&iacute;sticas</a>
      </nav>
    </div>
  </header>

  <main class="layout layout--ancho">

    <section class="panel">
      <div class="panel__head">
        <h2>Mensajes enviados en <span id="nombreMes">este mes</span></h2>
        <button id="btnActualizar" class="btn btn--ghost" type="button">Actualizar</button>
      </div>

      <div class="hero-grid">
        <div class="hero-num-wrap">
          <span class="hero-num" id="enviadosMes">&mdash;</span>
          <span class="hero-sub">mensajes enviados este mes</span>
        </div>
      </div>

      <div class="stats" id="statsMes"></div>
    </section>

    <section class="panel">
      <div class="panel__head"><h2>Mensajes enviados por mes</h2></div>
      <ul class="meses" id="meses"></ul>
    </section>

    <section class="panel">
      <div class="panel__head"><h2>Total hist&oacute;rico</h2></div>
      <div class="stats" id="statsTotal"></div>
    </section>

  </main>

  <div id="toast" class="toast" hidden></div>

  <script>
    (function () {
      const token = localStorage.getItem("snw_token"), rol = localStorage.getItem("snw_rol");
      if (!token) { location.replace("login.html"); return; }
      window.snwSalir = function () {
        ["snw_token", "snw_rol", "snw_nombre"].forEach(k => localStorage.removeItem(k));
        location.replace("index.html");
      };
      if (rol !== "administrador") {
        document.querySelectorAll("[data-solo-admin]").forEach(a => a.remove());
      }
      const n = document.getElementById("menuNav");
      const salir = document.createElement("a");
      salir.href = "#";
      salir.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> Cerrar sesi&oacute;n' || "";
      salir.addEventListener("click", async (e) => {
        e.preventDefault();
        try { await fetch("api/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + token } }); } catch {}
        localStorage.clear();
        location.href = "index.html";
      });
      n.appendChild(salir);
    })();
  </script>
  <script src="js/estadisticas.js"></script>
  <script>
    (function () {
      const b = document.getElementById("btnMenu"), n = document.getElementById("menuNav");
      if (!b || !n) return;
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        const o = n.classList.toggle("abierto");
        b.classList.toggle("abierto", o);
        b.setAttribute("aria-expanded", o);
      });
      document.addEventListener("click", (e) => {
        if (!b.contains(e.target) && !n.contains(e.target)) {
          n.classList.remove("abierto");
          b.classList.remove("abierto");
          b.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>
</html>
