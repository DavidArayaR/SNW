<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW &middot; Restablecer contrase&ntilde;a</title>
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/auth.css?v=auth2">
  <script src="js/tema.js"></script>
  <script src="js/pass-toggle.js"></script>
</head>
<body class="pagina-auth pagina-reset">

  <div class="card">
    <div class="logo">&#128273;</div>
    <h1>Nueva contrase&ntilde;a</h1>
    <p class="sub" id="sub">Verificando el enlace&hellip;</p>

    <form id="formReset" novalidate hidden>
      <label for="inpClave">Contrase&ntilde;a nueva</label>
      <input type="password" id="inpClave" autocomplete="new-password" required>

      <ul class="reglas" id="reglas">
        <li data-regla="len">Al menos 8 caracteres</li>
        <li data-regla="min">Una letra min&uacute;scula</li>
        <li data-regla="may">Una letra may&uacute;scula</li>
        <li data-regla="num">Un n&uacute;mero</li>
      </ul>

      <label for="inpClave2">Repite la contrase&ntilde;a</label>
      <input type="password" id="inpClave2" autocomplete="new-password" required>

      <p class="aviso" id="msg"></p>
      <button type="submit" id="btnGuardar">Guardar contrase&ntilde;a</button>
    </form>

    <p class="aviso aviso--error" id="msgEnlace"></p>

    <p class="nota">
      <a href="login.html">Volver a iniciar sesi&oacute;n</a>
    </p>
  </div>

  <script>
    if (window.snwMontarFabTema) window.snwMontarFabTema();

    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";

    const formReset = $("#formReset");
    const sub = $("#sub");
    const msg = $("#msg");
    const msgEnlace = $("#msgEnlace");
    const btn = $("#btnGuardar");
    const inpClave = $("#inpClave");
    const inpClave2 = $("#inpClave2");

    function chequeos(clave) {
      return {
        len: clave.length >= 8 && clave.length <= 128,
        min: /[a-z]/.test(clave),
        may: /[A-Z]/.test(clave),
        num: /\d/.test(clave),
      };
    }
    function pintarReglas() {
      const c = chequeos(inpClave.value);
      document.querySelectorAll("#reglas li").forEach((li) => {
        li.classList.toggle("ok", !!c[li.dataset.regla]);
      });
    }
    inpClave.addEventListener("input", pintarReglas);

    function mostrar(texto, tipo) {
      msg.textContent = texto;
      msg.className = "aviso visible aviso--" + tipo;
    }
    function enlaceInvalido(texto) {
      sub.textContent = "Este enlace ya no sirve.";
      msgEnlace.textContent = texto;
      msgEnlace.classList.add("visible");
    }

    (async function () {
      if (!token) { enlaceInvalido("Falta el token del enlace."); return; }
      try {
        const r = await fetch("api/auth/reset/" + encodeURIComponent(token));
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || "El enlace no es válido.");
        sub.textContent = "Elige una contraseña nueva para tu cuenta.";
        formReset.hidden = false;
        inpClave.focus();
      } catch (ex) {
        enlaceInvalido(ex.message);
      }
    })();

    formReset.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "aviso";
      const clave = inpClave.value;
      const c = chequeos(clave);
      if (!(c.len && c.min && c.may && c.num)) {
        inpClave.classList.add("malo");
        return mostrar("La contraseña no cumple los requisitos.", "error");
      }
      inpClave.classList.remove("malo");
      if (clave !== inpClave2.value) {
        inpClave2.classList.add("malo");
        return mostrar("Las contraseñas no coinciden.", "error");
      }
      inpClave2.classList.remove("malo");

      btn.disabled = true;
      btn.textContent = "Guardando...";
      try {
        const r = await fetch("api/auth/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, clave_nueva: clave }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || "No se pudo cambiar la contraseña.");
        formReset.hidden = true;
        sub.textContent = "";
        msgEnlace.textContent = "Contraseña actualizada. Redirigiendo al inicio de sesión…";
        msgEnlace.className = "aviso aviso--ok visible";
        setTimeout(() => location.replace("login.html"), 1600);
      } catch (ex) {
        mostrar(ex.message, "error");
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
      }
    });
  </script>
</body>
</html>
