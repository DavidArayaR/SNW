<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW &middot; Configuraci&oacute;n</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/tema.css?v=tokens1">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/layout.css?v=navcolor1">
  <link rel="stylesheet" href="css/admin.css?v=tokens1">
  <link rel="stylesheet" href="css/configuracion.css?v=tabs1">
  <link rel="stylesheet" href="css/refinamiento.css?v=merge-frontend1">
  <link rel="stylesheet" href="css/estilo-nuevo.css?v=1">
  <script src="js/tema.js?v=scrollbar1"></script>
</head>
<body data-pagina="configuracion" data-seccion="administracion">

  <div class="app-shell">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="app-topbar">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Abrir men&uacute;">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="app-topbar__titulo">Configuraci&oacute;n</span>
        <div class="msg-tabs config-tabs" role="tablist" aria-label="Secciones de configuración">
          <button type="button" class="msg-tab activo" id="config-tab-general" data-config-tab="general" role="tab" aria-selected="true" aria-controls="config-panel-general">General</button>
          <button type="button" class="msg-tab" id="config-tab-whatsapp" data-config-tab="whatsapp" role="tab" aria-selected="false" aria-controls="config-panel-whatsapp">WhatsApp</button>
          <button type="button" class="msg-tab" id="config-tab-clinicas" data-config-tab="clinicas" role="tab" aria-selected="false" aria-controls="config-panel-clinicas">Clínicas</button>
          <button type="button" class="msg-tab" id="config-tab-correo" data-config-tab="correo" role="tab" aria-selected="false" aria-controls="config-panel-correo">Correo</button>
          <button type="button" class="msg-tab" id="config-tab-integraciones" data-config-tab="integraciones" role="tab" aria-selected="false" aria-controls="config-panel-integraciones">Integraciones</button>
        </div>
        <span class="app-topbar__sep"></span>
      </header>

      <main class="layout layout--ancho">

        <section class="panel">
          <div class="panel__head">
            <h2>Configuraci&oacute;n</h2>
            <button id="btnGuardar" class="btn btn--primary" type="button" disabled>Guardar cambios</button>
          </div>
          <p class="config-intro">
            Todos los ajustes de la aplicaci&oacute;n. Se guardan en la base de datos y (salvo el
            entorno activo) se aplican sin reiniciar.
          </p>

          <div class="config-api-docs" id="configApiDocs">
            <div>
              <h3>Documentación de la API</h3>
              <p>Consulta los endpoints con tu cuenta de desarrollador.</p>
            </div>
            <a class="btn btn--ghost" href="/docs" target="_blank" rel="noopener">
              <i class="fa-solid fa-book-open" aria-hidden="true"></i>
              Abrir documentación
            </a>
          </div>

          <div id="secciones"></div>
        </section>

      </main>
    </div>
  </div>

  <div class="config-guardar-fijo" id="barraGuardar" hidden>
    <span id="cambiosResumen">Sin cambios</span>
    <div class="config-guardar-fijo__btns">
      <button id="btnDescartar" class="btn btn--ghost" type="button">Descartar</button>
      <button id="btnGuardarFijo" class="btn btn--primary" type="button">Guardar cambios</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/layout.js?v=permisos-acciones1"></script>
  <script src="js/configuracion.js?v=tabs1"></script>
  <script>
    if (window.snwCargarConfiguracion) window.snwCargarConfiguracion();
  </script>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
