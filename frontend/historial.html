<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW · Historial</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pacientes.css">
</head>
<body>

  <header class="topbar">
    <a class="topbar__brand" href="index.html" title="Volver al inicio">
      <div>
        <h1>Notificaciones WhatsApp</h1>
        <p>Sistema de Notificaciones SNW</p>
      </div>
    </a>
    <div class="topbar__right">
      <span class="badge badge--dev" id="badgeEntorno">Ambiente: —</span>
      <button class="hamburger" id="btnMenu" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="menuNav">
        <a href="index.html">Inicio</a>
        <a href="pacientes.html" data-solo-admin>Pacientes</a>
        <a href="mensajeria.html">Mensajería</a>
        <a href="historial.html" class="activo">Historial</a>
      </nav>
    </div>
  </header>

  <main class="layout layout--ancho">

    <section class="panel">
      <div class="panel__head">
        <h2>Historial de mensajes</h2>
        <button id="btnActualizar" class="btn btn--ghost" type="button">Actualizar</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar-pacientes">
        <input type="search" id="buscador" placeholder="Buscar por paciente, teléfono, plantilla o detalle..." autocomplete="off">
        <span id="contador" class="contador-sel"></span>
      </div>

      <div class="tabla-wrap">
        <table id="tablaHistorial">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Paciente</th>
              <th>Teléfono</th>
              <th>Plantilla</th>
              <th>Mensaje</th>
              <th>Estado</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="tablaVacia" class="tabla-vacia" hidden>Sin registros.</p>
      </div>
    </section>

  </main>

  <div id="modalDetalle" class="modal" hidden>
    <div class="modal__card modal__card--detalle" role="dialog" aria-modal="true">
      <h3>Detalle del envío</h3>
      <div id="detalleCampos"></div>
      <p class="detalle-subtitulo">Mensaje enviado</p>
      <div class="bubble-msg" id="detalleMensaje"></div>
      <div class="detalle-error" id="detalleError" hidden></div>
      <div class="modal__actions">
        <button type="button" class="btn btn--primary" id="btnCerrarDetalle">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    (function () {
      const token = localStorage.getItem("snw_token"), rol = localStorage.getItem("snw_rol");
      if (!token) { location.replace("login.html"); return; }
      window.snwSalir = function () {
        ["snw_token", "snw_rol", "snw_nombre"].forEach(k => localStorage.removeItem(k));
        location.replace("login.html");
      };
      if (rol !== "administrador") {
        document.querySelectorAll("[data-solo-admin]").forEach(a => a.remove());
      }
      const n = document.getElementById("menuNav");
      const salir = document.createElement("a");
      salir.href = "#";
      salir.textContent = "Cerrar sesión · " + (localStorage.getItem("snw_nombre") || "");
      salir.addEventListener("click", async (e) => {
        e.preventDefault();
        try { await fetch("api/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + token } }); } catch {}
        localStorage.clear();
        location.href = "login.html";
      });
      n.appendChild(salir);
    })();
  </script>
  <script src="js/historial.js"></script>
  <script>
    (function () {
      const b = document.getElementById("btnMenu"), n = document.getElementById("menuNav");
      if (!b || !n) return;
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        const o = n.classList.toggle("abierto");
        b.classList.toggle("abierto", o);
        b.setAttribute("aria-expanded", o);
      });
      document.addEventListener("click", (e) => {
        if (!b.contains(e.target) && !n.contains(e.target)) {
          n.classList.remove("abierto");
          b.classList.remove("abierto");
          b.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>
</html>
