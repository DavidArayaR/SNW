<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW · Historial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pacientes.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body data-pagina="historial">

  <div class="app-shell">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="app-topbar">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="app-topbar__titulo">Historial</span>
        <span class="app-topbar__sep"></span>
        <span class="badge badge--dev" id="badgeEntorno">Ambiente: &mdash;</span>
      </header>

  <main class="layout layout--ancho">

    <section class="panel">
      <div class="panel__head">
        <h2>Historial de env&iacute;os</h2>
        <button id="btnActualizar" class="btn btn--ghost" type="button">Actualizar</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar-pacientes">
        <input type="search" id="buscador" placeholder="Buscar por base de datos o plantilla..." autocomplete="off">
        <span id="contador" class="contador-sel"></span>
      </div>

      <div class="tabla-wrap">
        <table id="tablaHistorial">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Base de datos</th>
              <th>Plantilla</th>
              <th>Estado</th>
              <th>Total</th>
              <th>Enviados</th>
              <th>Fallidos</th>
              <th>Inv&aacute;lidos</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="tablaVacia" class="tabla-vacia" hidden>Sin env&iacute;os registrados.</p>
      </div>
    </section>

      </main>
    </div>
  </div>

  <div id="modalDetalle" class="modal" hidden>
    <div class="modal__card modal__card--detalle" role="dialog" aria-modal="true">
      <h3 id="detalleTitulo">Pacientes del env&iacute;o</h3>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Paciente</th>
              <th>Respuesta</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="detalleBody"></tbody>
        </table>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--primary" id="btnCerrarDetalle">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/layout.js"></script>
  <script src="js/historial.js"></script>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
