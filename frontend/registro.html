<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNW &middot; Crear cuenta</title>
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/tema.js"></script>
  <script src="js/pass-toggle.js"></script>
</head>
<body class="pagina-auth pagina-registro">

  <div class="card">
    <div class="logo">&#128100;</div>
    <h1>Crear una cuenta</h1>
    <p class="sub" id="sub">Verificando la invitaci&oacute;n&hellip;</p>

    <form id="formRegistro" novalidate hidden>
      <label for="inpUsuario">Correo electr&oacute;nico</label>
      <input type="email" id="inpUsuario" disabled>

      <label for="inpClave">Contrase&ntilde;a</label>
      <input type="password" id="inpClave" autocomplete="new-password" required>

      <ul class="reglas" id="reglas">
        <li data-regla="len">Al menos 8 caracteres</li>
        <li data-regla="min">Una letra min&uacute;scula</li>
        <li data-regla="may">Una letra may&uacute;scula</li>
        <li data-regla="num">Un n&uacute;mero</li>
      </ul>

      <label for="inpClave2">Repite la contrase&ntilde;a</label>
      <input type="password" id="inpClave2" autocomplete="new-password" required>

      <p class="aviso" id="msg"></p>
      <button type="submit" id="btnCrear">Crear cuenta</button>
    </form>

    <p class="aviso aviso--error" id="msgEnlace"></p>

    <p class="nota">
      <a href="login.html">Volver a iniciar sesi&oacute;n</a>
    </p>
  </div>

  <script>
    if (window.snwMontarFabTema) window.snwMontarFabTema();

    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";

    const sub = $("#sub");
    const formRegistro = $("#formRegistro");
    const inpUsuario = $("#inpUsuario");
    const inpClave = $("#inpClave");
    const inpClave2 = $("#inpClave2");
    const msg = $("#msg");
    const msgEnlace = $("#msgEnlace");
    const btn = $("#btnCrear");

    function chequeos(clave) {
      return {
        len: clave.length >= 8 && clave.length <= 128,
        min: /[a-z]/.test(clave),
        may: /[A-Z]/.test(clave),
        num: /\d/.test(clave),
      };
    }

    function pintarReglas() {
      const c = chequeos(inpClave.value);
      document.querySelectorAll("#reglas li").forEach((li) => {
        li.classList.toggle("ok", !!c[li.dataset.regla]);
      });
    }
    inpClave.addEventListener("input", pintarReglas);

    function mostrar(texto, tipo) {
      msg.textContent = texto;
      msg.className = "aviso visible aviso--" + tipo;
    }
    function enlaceInvalido(texto) {
      sub.textContent = "Este enlace ya no sirve.";
      msgEnlace.textContent = texto;
      msgEnlace.classList.add("visible");
    }

    (async function () {
      if (!token) { enlaceInvalido("Falta el token de la invitación."); return; }
      try {
        const r = await fetch("api/auth/invitacion/" + encodeURIComponent(token));
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || "El enlace no es válido.");
        inpUsuario.value = data.correo || "";
        sub.textContent = "Elige una contraseña para tu cuenta.";
        formRegistro.hidden = false;
        inpClave.focus();
      } catch (ex) {
        enlaceInvalido(ex.message);
      }
    })();

    formRegistro.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "aviso";
      const clave = inpClave.value;

      const c = chequeos(clave);
      if (!(c.len && c.min && c.may && c.num)) {
        inpClave.classList.add("malo");
        return mostrar("La contraseña no cumple los requisitos.", "error");
      }
      inpClave.classList.remove("malo");

      if (clave !== inpClave2.value) {
        inpClave2.classList.add("malo");
        return mostrar("Las contraseñas no coinciden.", "error");
      }
      inpClave2.classList.remove("malo");

      btn.disabled = true;
      btn.textContent = "Creando...";
      try {
        const res = await fetch("api/auth/activar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, clave }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "No se pudo crear la cuenta.");

        localStorage.setItem("snw_token", data.token);
        localStorage.setItem("snw_rol", data.rol);
        localStorage.setItem("snw_nombre", data.nombre);
        localStorage.setItem("snw_permisos", JSON.stringify(data.permisos || []));

        mostrar("Cuenta creada. Entrando…", "ok");
        setTimeout(() => {
          location.replace(data.rol === "administrador" || data.rol === "desarrollador"
            ? "usuarios.html" : "mensajeria.html");
        }, 900);
      } catch (ex) {
        mostrar(ex.message, "error");
        btn.disabled = false;
        btn.textContent = "Crear cuenta";
      }
    });
  </script>
</body>
</html>
